<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f6f5fc;
        color: #17161f;
      }
      .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; }
      .blob-a {
        width: 720px; height: 720px; right: -230px; top: -270px;
        background: radial-gradient(circle, rgba(124, 58, 237, .20), rgba(124, 58, 237, 0) 68%);
      }
      .blob-b {
        width: 560px; height: 560px; left: -240px; bottom: -260px;
        background: radial-gradient(circle, rgba(79, 70, 229, .16), rgba(79, 70, 229, 0) 70%);
      }
      .dots {
        position: absolute; inset: 0; opacity: .30;
        background-image: radial-gradient(rgba(79, 70, 229, .28) 1px, transparent 1px);
        background-size: 24px 24px;
        mask-image: radial-gradient(circle at 28% 46%, #000 0%, transparent 62%);
      }
      .left { position: absolute; left: 96px; top: 148px; width: 560px; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 12px 7px 9px; border-radius: 999px;
        background: rgba(255,255,255,.82); border: 1px solid rgba(79,70,229,.16);
        box-shadow: 0 6px 18px rgba(40, 32, 110, .06);
        font-size: 12.5px; font-weight: 600; color: #4f46e5; letter-spacing: .2px;
      }
      .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, hsl(239 84% 67%), hsl(268 72% 60%)); }
      h1 {
        margin: 20px 0 0; font-size: 44px; line-height: 1.18; letter-spacing: -1.1px;
        font-weight: 720;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(135deg, hsl(239 84% 62%), hsl(268 72% 58%));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lede { margin: 16px 0 0; font-size: 17px; line-height: 1.7; color: #5b596b; }
      .bullets { margin: 30px 0 0; padding: 0; list-style: none; display: grid; gap: 14px; }
      .bullets li { display: flex; gap: 11px; align-items: flex-start; font-size: 15.5px; line-height: 1.55; color: #34323f; }
      .bullets i {
        flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 7px;
        background: rgba(79, 70, 229, .10); border: 1px solid rgba(79, 70, 229, .16);
        display: grid; place-items: center;
      }
      .bullets i::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, hsl(239 84% 67%), hsl(268 72% 60%)); }
      .frame { position: absolute; right: 80px; top: 61px; width: 520px; }
      .frame .shot {
        display: block; width: 520px; height: 677px; border-radius: 22px;
        box-shadow: 0 34px 70px rgba(37, 28, 96, .24), 0 4px 14px rgba(37, 28, 96, .10);
        border: 1px solid rgba(255,255,255,.9);
        background: #fff;
      }
      .frame .label {
        position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%);
        font-size: 12px; color: #77748a; letter-spacing: .4px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="dots"></div>

      <div class="left">
        <span class="eyebrow"><i></i>工具栏弹窗</span>
        <h1>顺手清掉几个标签，<br /><em>不用打开 Dashboard</em></h1>
        <p class="lede">点开扩展就是一个按站点整理好的清单。<br />谁在闲置、谁重复了，一眼就能看到。</p>
        <ul class="bullets">
          <li><i></i>按站点分组，闲置与重复用颜色区分</li>
          <li><i></i>搜索同时覆盖标签、书签、历史与最近关闭</li>
          <li><i></i>拖进收藏区是「暂存」，不会关掉标签</li>
        </ul>
      </div>

      <div class="frame">
        <img class="shot" src="popup.png" alt="Tab Steward 弹窗" />
        <span class="label">430 × 560 · 工具栏弹窗实际尺寸</span>
      </div>
    </div>
  </body>
</html>
