<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f6f5fc;
        color: #17161f;
      }
      .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; }
      .blob-a {
        width: 720px; height: 720px; right: -230px; top: -270px;
        background: radial-gradient(circle, rgba(124, 58, 237, .20), rgba(124, 58, 237, 0) 68%);
      }
      .blob-b {
        width: 560px; height: 560px; left: -240px; bottom: -260px;
        background: radial-gradient(circle, rgba(79, 70, 229, .16), rgba(79, 70, 229, 0) 70%);
      }
      .dots {
        position: absolute; inset: 0; opacity: .30;
        background-image: radial-gradient(rgba(79, 70, 229, .28) 1px, transparent 1px);
        background-size: 24px 24px;
        mask-image: radial-gradient(circle at 24% 50%, #000 0%, transparent 60%);
      }
      .left { position: absolute; left: 96px; top: 148px; width: 410px; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 12px 7px 9px; border-radius: 999px;
        background: rgba(255,255,255,.82); border: 1px solid rgba(79,70,229,.16);
        box-shadow: 0 6px 18px rgba(40, 32, 110, .06);
        font-size: 12.5px; font-weight: 600; color: #4f46e5; letter-spacing: .2px;
      }
      .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, hsl(239 84% 67%), hsl(268 72% 60%)); }
      h1 {
        margin: 20px 0 0; font-size: 42px; line-height: 1.2; letter-spacing: -1px;
        font-weight: 720;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(135deg, hsl(239 84% 62%), hsl(268 72% 58%));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lede { margin: 16px 0 0; font-size: 16px; line-height: 1.72; color: #5b596b; }
      .bullets { margin: 28px 0 0; padding: 0; list-style: none; display: grid; gap: 13px; }
      .bullets li { display: flex; gap: 11px; align-items: flex-start; font-size: 15px; line-height: 1.55; color: #34323f; }
      .bullets i {
        flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 7px;
        background: rgba(79, 70, 229, .10); border: 1px solid rgba(79, 70, 229, .16);
        display: grid; place-items: center;
      }
      .bullets i::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, hsl(239 84% 67%), hsl(268 72% 60%)); }
      .frame { position: absolute; right: 52px; top: 100px; width: 680px; }
      .frame .shot {
        display: block; width: 680px; height: 578px; border-radius: 12px;
        box-shadow: 0 34px 70px rgba(37, 28, 96, .24), 0 4px 14px rgba(37, 28, 96, .10);
        border: 1px solid rgba(255,255,255,.9);
        background: #fff;
      }
      .frame .label {
        position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%);
        font-size: 12px; color: #77748a; letter-spacing: .4px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="dots"></div>

      <div class="left">
        <span class="eyebrow"><i></i>页面右键菜单</span>
        <h1>在任意网页上，<br /><em>右键就能整理</em></h1>
        <p class="lede">不用切回扩展：设提醒、暂存、休眠、<br />移动与整组整理，都在浏览器菜单里。</p>
        <ul class="bullets">
          <li><i></i>动作项带 emoji，取值项才展开二级菜单</li>
          <li><i></i>「暂存」不关标签，只有「暂存并关闭」才关</li>
          <li><i></i>浏览器启动时自动重建整棵菜单</li>
        </ul>
      </div>

      <div class="frame">
        <img class="shot" src="context-menu.png" alt="Tab Steward 右键菜单" />
        <span class="label">浏览器原生右键菜单 · 与页面其他菜单项并列</span>
      </div>
    </div>
  </body>
</html>
