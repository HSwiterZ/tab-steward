<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, hsl(239 84% 60%), hsl(268 72% 52%));
        color: #fff;
      }
      .tile { position: relative; width: 100%; height: 100%; padding: 64px 72px; display: flex; align-items: center; gap: 56px; }
      .glow-a, .glow-b { position: absolute; border-radius: 50%; pointer-events: none; }
      .glow-a { width: 640px; height: 640px; right: -160px; top: -260px; background: radial-gradient(circle, rgba(255,255,255,.30), transparent 68%); }
      .glow-b { width: 520px; height: 520px; left: -200px; bottom: -300px; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); }
      .grid {
        position: absolute; inset: 0; opacity: .14; pointer-events: none;
        background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: linear-gradient(115deg, transparent 6%, #000 52%, transparent 96%);
      }
      .left { position: relative; width: 600px; flex: none; }
      .mark {
        width: 96px; height: 96px; border-radius: 26px;
        background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.34);
        display: grid; place-items: center;
        box-shadow: 0 18px 40px rgba(23, 16, 64, .30);
      }
      .mark img { width: 76px; height: 76px; border-radius: 20px; display: block; }
      .name { margin-top: 30px; font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -1.6px; }
      .tag { margin-top: 16px; font-size: 22px; line-height: 1.45; color: rgba(255,255,255,.87); }
      .chips { margin-top: 34px; display: flex; gap: 10px; }
      .chip {
        font-size: 17px; line-height: 1; padding: 10px 16px; border-radius: 999px;
        background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26);
        color: rgba(255,255,255,.94);
      }
      .right { position: relative; flex: 1; display: flex; justify-content: flex-end; align-items: center; }
      .shot {
        width: 560px; height: 350px; border-radius: 18px; overflow: hidden; background: #fff;
        box-shadow: 0 46px 90px rgba(18, 10, 50, .48), 0 0 0 1px rgba(255,255,255,.24);
      }
      .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="grid"></div>
      <div class="glow-a"></div>
      <div class="glow-b"></div>
      <div class="left">
        <div class="mark"><img src="../../assets/icon128.png" alt="" /></div>
        <div class="name">Tab Steward</div>
        <div class="tag">标签太多，就让它们自己站好队。</div>
        <div class="chips">
          <span class="chip">按站点聚合</span>
          <span class="chip">统一搜索</span>
          <span class="chip">休眠与暂存</span>
          <span class="chip">数据只在本机</span>
        </div>
      </div>
      <div class="right">
        <div class="shot"><img src="../screenshots/01-overview.png" alt="" /></div>
      </div>
    </div>
  </body>
</html>
