<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, hsl(239 84% 60%), hsl(268 72% 52%));
        color: #fff;
      }
      .tile { position: relative; width: 100%; height: 100%; padding: 30px 32px; overflow: hidden; }
      .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(0); }
      .glow-a { width: 260px; height: 260px; right: -90px; top: -110px; background: radial-gradient(circle, rgba(255,255,255,.34), transparent 68%); }
      .glow-b { width: 220px; height: 220px; left: -80px; bottom: -120px; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); }
      .grid {
        position: absolute; inset: 0; opacity: .16;
        background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
        background-size: 18px 18px;
        mask-image: linear-gradient(120deg, transparent 10%, #000 55%, transparent 95%);
      }
      .mark {
        position: relative; width: 64px; height: 64px; border-radius: 18px;
        background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.34);
        display: grid; place-items: center;
        box-shadow: 0 14px 30px rgba(23, 16, 64, .28);
      }
      .mark img { width: 50px; height: 50px; border-radius: 13px; display: block; }
      .name { position: relative; margin-top: 18px; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -.4px; }
      .tag { position: relative; margin-top: 8px; font-size: 14px; line-height: 1.4; color: rgba(255,255,255,.84); }
      .chips { position: absolute; left: 32px; bottom: 26px; display: flex; gap: 7px; }
      .chip {
        font-size: 11.5px; line-height: 1; padding: 6px 10px; border-radius: 999px;
        background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24);
        color: rgba(255,255,255,.92);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="grid"></div>
      <div class="glow-a"></div>
      <div class="glow-b"></div>
      <div class="mark"><img src="../../assets/icon128.png" alt="" /></div>
      <div class="name">Tab Steward</div>
      <div class="tag">标签太多，就让它们自己站好队。</div>
      <div class="chips">
        <span class="chip">聚合</span>
        <span class="chip">搜索</span>
        <span class="chip">休眠</span>
        <span class="chip">暂存</span>
      </div>
    </div>
  </body>
</html>
